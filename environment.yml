name: rt-hare
channels:
  - pytorch
  - nvidia/label/cuda-11.8.0
  - conda-forge
  - defaults
dependencies:
  - python=3.8.18
  - pip=23.3.1
  - wheel
  - setuptools
  # CUDA 11.8 Toolkit (Compatible with Dual RTX 3090 / JetPack 5.1.1 toolchain)
  - cuda-toolkit=11.8.0
  # PyTorch stack
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8
  # Core scientific packages
  - numpy>=1.22.4,<2.0.0
  - scipy>=1.9.0
  - pandas>=1.5.0
  - matplotlib>=3.5.0
  - seaborn>=0.12.0
  - pyyaml>=6.0
  - h5py>=3.8.0
  - tqdm>=4.64.0
  - pillow>=9.5.0
  - scikit-learn>=1.2.0
  - pip:
      # ONNX and ONNX Runtime GPU
      - onnx>=1.14.0,<=1.16.0
      - onnxruntime-gpu>=1.15.0,<=1.17.1
      # TensorRT and PyCUDA for engine compilation and inference
      - tensorrt>=8.5.2,<=8.6.1; sys_platform != "win32" and platform_machine != "aarch64"
      - pycuda>=2022.2.2; sys_platform != "win32"
      # Computer Vision & Video
      - opencv-python>=4.8.0.76,<5.0.0
      - av>=10.0.0
      # Evaluation metric: Levenshtein distance for Edit score (Paper Sec. VI-E1)
      - editdistance>=0.6.2
